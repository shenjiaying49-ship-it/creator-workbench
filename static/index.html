<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jocelyn · 创作周历</title><link rel="stylesheet" href="/desk.css?v=3"><link rel="stylesheet" href="/workspace.css?v=1"></head><body><header><a class="brand" href="#/week">J. <span>Jocelyn 创作台</span></a><nav class="app-nav"><a href="#/week">周排期</a><a href="#/review">数据与复盘</a></nav><div class="switch" id="platform-switch" hidden><label for="platform">发布平台</label><select id="platform"><option>小红书</option><option>抖音</option><option>Threads</option></select></div></header><main><p id="app-notice" role="status" aria-live="polite"></p><section id="week-view"></section><section id="review-view" hidden></section><section id="editor-view" hidden><a id="back-week" href="#/week" class="back-link">← 返回周排期</a><div class="heading"><div><span class="eyebrow">ONE GOOD PIECE A DAY</span><h1>编辑工作台</h1></div><input id="day" type="date" aria-label="稿件日期"></div><select id="edition" aria-label="稿件版本" hidden></select><p id="notice" role="status" aria-live="polite">正在读取今日稿件…</p><section id="empty" hidden><h2>这个日期或平台还没有稿件。</h2><p>Codex 每天从飞书选题、范文与可用的指定信息源备稿；已有稿件可通过右上角切换平台查看。</p></section><section id="draft" hidden><div class="meta"><span id="format" class="pill"></span><span id="status"></span></div><p id="reason"></p><label class="sr" for="title">标题</label><input id="title" class="title" maxlength="200"><label class="sr" for="body">正文</label><textarea id="body" placeholder="你的正文会出现在这里。" maxlength="30000"></textarea><p id="tags"></p><div class="toolbar"><span id="save-state">未修改</span><button id="copy">复制正文</button><button id="save" class="primary">保存修改</button></div><details class="evidence"><summary>这篇依据了什么</summary><div id="evidence"></div></details></section><p class="daily-note">每天 08:00，Codex 准备一篇。图文你配图，口播你录制。</p><details id="library-panel"><summary>飞书五库与信息源 <span id="sync-time"></span></summary><div class="library-bar"><select id="library-kind" aria-label="内容库"><option value="topics">选题库</option><option value="examples">优质范文库</option><option value="rules">规则库</option><option value="works">作品库</option><option value="reviews">复盘库</option><option value="monitor">监控信息源</option></select><button id="sync">同步飞书</button><a id="feishu" target="_blank" rel="noopener">打开飞书 ↗</a></div><div id="library"></div></details></section><footer><span>每天备稿，按你的节奏完成。</span></footer></main><script src="/desk.js?v=3" defer></script><script src="/workspace.js?v=1" defer></script></body></html>
