<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jocelyn · 创作台</title><link rel="stylesheet" href="/board.css?v=1"></head><body>
<header><a class="brand" href="/index.html"><b>J.</b> Jocelyn <span>创作台</span></a><div class="top-actions"><span id="sync-state" role="status">读取中…</span><button id="sync">刷新</button><a id="base-link" target="_blank" rel="noopener">打开飞书 ↗</a></div></header>
<main><div class="intro"><div><p class="eyebrow">MAKE SOMETHING WORTH SHARING</p><h1>把下一篇，做出来。</h1></div><span id="capacity"></span></div>
<nav aria-label="工作区"><button data-tab="plan" class="active">排期</button><button data-tab="drafts">稿件</button><button data-tab="review">复盘</button></nav><div id="notice" role="status" aria-live="polite"></div>
<section id="plan" class="tab"><div class="section-head"><h2>近期要做</h2><span id="plan-count"></span></div><div id="plan-list" class="list"><p>正在读取排期…</p></div><details class="pool"><summary>从五库选下一篇 <span id="pool-count"></span></summary><label class="sr" for="search">搜索五库选题</label><input id="search" placeholder="搜索选题"><div id="topic-list"></div></details></section>
<section id="drafts" class="tab" hidden><div class="section-head"><h2>继续写</h2><select id="draft-filter" aria-label="稿件状态"><option value="">全部</option><option>草稿</option><option>待发布</option><option>已发布</option></select></div><div id="draft-list" class="list"></div></section>
<section id="review" class="tab" hidden><div class="section-head"><h2>发布后，回来看看</h2><button id="review-open" class="primary">录入数据</button></div><div id="review-list" class="list"></div></section>
<footer><span>Jocelyn · 飞书五库</span><details><summary>历史与工具</summary><a href="/legacy-index.html">旧稿件库 ↗</a><a href="/legacy-daily.html">旧排期与数据 ↗</a><a href="/studio.html">多平台工作台 ↗</a></details></footer></main>
<dialog id="editor"><form id="editor-form"><div class="section-head"><h2 id="editor-heading">写稿</h2><button type="button" data-close="editor" aria-label="关闭">×</button></div><div id="versions" class="versions"></div><label for="edit-title">标题</label><input id="edit-title" maxlength="200" required><label for="edit-body">正文 <span id="word-count"></span></label><textarea id="edit-body" maxlength="30000" placeholder="写下真实素材，或从AI任务包开始。"></textarea><div class="fields"><div><label for="edit-status">制作状态</label><select id="edit-status"><option>草稿</option><option>待发布</option><option>已发布</option></select></div><div id="publish-date-wrap" hidden><label for="publish-date">实际发布日期</label><input id="publish-date" type="date"></div></div><details><summary>选题依据与 Skill</summary><p id="editor-notes"></p><button id="copy-kit" type="button">复制 AI 任务包</button></details><div class="form-actions"><span id="save-state">直接保存到飞书</span><button class="primary" id="save-draft">保存到飞书</button></div></form></dialog>
<dialog id="planner"><form id="planner-form"><div class="section-head"><h2>安排这篇</h2><button type="button" data-close="planner" aria-label="关闭">×</button></div><p id="planner-title"></p><label for="plan-date">生产日期</label><input id="plan-date" type="date" required><label for="plan-minutes">预计分钟</label><input id="plan-minutes" type="number" min="1" max="480" required value="45"><div class="form-actions"><button class="primary">保存到飞书</button></div></form></dialog>
<dialog id="reviewer"><form id="review-form"><div class="section-head"><h2>录入数据</h2><button type="button" data-close="reviewer" aria-label="关闭">×</button></div><label for="review-work">作品</label><select id="review-work" required></select><div class="fields"><div><label for="review-date">观察日期</label><input id="review-date" type="date" required></div><div><label for="review-window">口径</label><select id="review-window"><option>24h</option><option>7d</option><option>累计</option></select></div></div><small>错过观察点且没有历史数据时，选“累计”。</small><div class="three"> <div><label for="views">观看</label><input id="views" type="number" min="0" placeholder="未知留空"></div><div><label for="collects">收藏</label><input id="collects" type="number" min="0" placeholder="未知留空"></div><div><label for="follows">新增关注</label><input id="follows" type="number" min="0" placeholder="未知留空"></div></div><label for="review-next">下一篇，只改什么？</label><textarea id="review-next" maxlength="2000"></textarea><div class="form-actions"><button class="primary">保存到飞书</button></div></form></dialog>
<script src="/board.js?v=1" defer></script></body></html>
